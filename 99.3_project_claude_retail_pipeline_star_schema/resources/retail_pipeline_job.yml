# =============================================================================
# resources/retail_pipeline_job.yml
# Databricks Job resource — included by databricks.yml
#
# Pipeline order: bronze_ingest -> silver_load -> gold_star_schema
# The dim_date setup notebook is NOT part of this daily job — run it once
# manually per environment via: databricks bundle run setup_dim_date --target qa
# =============================================================================

resources:
  jobs:

    # ── One-time / on-demand: run all SQL DDL (catalog, schemas, tables) ───
    setup_run_ddl:
      name: retail_setup_run_ddl_${var.env}
      description: "One-time setup: create catalog, schemas, bronze/silver/gold/quarantine tables"

      tasks:
        - task_key: setup_run_ddl
          notebook_task:
            notebook_path: ../notebooks/setup_run_ddl.py
            source: WORKSPACE
            base_parameters:
              env: ${var.env}
          timeout_seconds: 900

    # ── Daily medallion pipeline ────────────────────────────────────────────
    retail_pipeline_daily:
      name: retail_pipeline_daily_${var.env}
      description: "Medallion pipeline: CSV -> Bronze -> Silver (DQX) -> Gold star schema (DQX)"

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"     # 06:00 daily IST
        timezone_id: "Asia/Kolkata"
        pause_status: UNPAUSED

      email_notifications:
        on_failure:
          - sumandby003@gmail.com
        on_success: []

      max_concurrent_runs: 1

      tasks:
        - task_key: bronze_ingest
          description: "Load daily sales CSV from ADLS Gen2 to Bronze"
          notebook_task:
            notebook_path: ../notebooks/01_bronze_ingest.py
            source: WORKSPACE
            base_parameters:
              env: ${var.env}
              pipeline_run: "{{job.run_id}}"
              process_date: ${var.process_date}
          timeout_seconds: 1800
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: false

        - task_key: silver_load
          description: "Bronze -> Silver: cast, dedup, DQX checks, append"
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: ../notebooks/02_silver_load.py
            source: WORKSPACE
            base_parameters:
              env: ${var.env}
              pipeline_run: "{{job.run_id}}"
              process_date: ${var.process_date}
          timeout_seconds: 3600
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: false

        - task_key: gold_star_schema
          description: "Silver -> Gold: upsert dims (SCD1), DQX checks, MERGE fact_sales"
          depends_on:
            - task_key: silver_load
          notebook_task:
            notebook_path: ../notebooks/03_gold_star_schema.py
            source: WORKSPACE
            base_parameters:
              env: ${var.env}
              pipeline_run: "{{job.run_id}}"
              process_date: ${var.process_date}
          timeout_seconds: 1800
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: false

    # ── One-time / on-demand: populate dim_date ────────────────────────────
    setup_dim_date:
      name: retail_setup_dim_date_${var.env}
      description: "One-time setup: populate gold.dim_date for the configured date range"


      tasks:
        - task_key: setup_dim_date
          notebook_task:
            notebook_path: ../notebooks/00_setup_dim_date.py
            source: WORKSPACE
            base_parameters:
              env: ${var.env}
          timeout_seconds: 900
