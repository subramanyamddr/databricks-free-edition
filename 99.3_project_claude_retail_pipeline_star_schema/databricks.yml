# =============================================================================
# databricks.yml
# Databricks Asset Bundle (DAB) — root configuration for retail_pipeline
#
# Deploy: databricks bundle deploy --target qa
# Run:    databricks bundle run retail_pipeline_daily --target qa
# =============================================================================

bundle:
  name: retail_pipeline

include:
  - resources/*.yml

variables:
  env:
    default: dev
    description: "Target environment: dev | qa | prod"
  catalog_name:
    description: "Unity Catalog name for the target environment"
  process_date:
    default: ""
    description: "Optional override: business date yyyy-MM-dd (blank = yesterday)"

# ── Targets ──────────────────────────────────────────────────────────────────

targets:

  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-4f4ede49-13be.cloud.databricks.com/
      root_path: /Workspace/Repos/${workspace.current_user.userName}/retail_pipeline
    variables:
      env: dev
      catalog_name: dev_catalog

  qa:
    mode: production
    workspace:
      host: https://dbc-4f4ede49-13be.cloud.databricks.com/
      root_path: /Workspace/Repos/retail_pipeline
    run_as:
      service_principal_name: "<qa-service-principal-app-id>"
    variables:
      env: qa
      catalog_name: qa_catalog

  prod:
    mode: production
    workspace:
      host: https://dbc-4f4ede49-13be.cloud.databricks.com/
      root_path: /Workspace/Repos/retail_pipeline
    run_as:
      service_principal_name: "<prod-service-principal-app-id>"
    variables:
      env: prod
      catalog_name: prod_catalog
      adls_account: prodstorageaccount
